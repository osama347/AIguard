# Builds the Guard++ desktop installers for Windows, macOS and Linux.
# Run manually (Actions → Desktop installers) or push a tag like desktop-v2.5.0.
# Installers are attached to the workflow run as artifacts, and on a tag push
# also published to a GitHub Release together with latest.json for auto-update.
# The tag must match the version in tauri.conf.json, Cargo.toml and package.json.
name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: "" }
          - { os: macos-latest,   args: "--target universal-apple-darwin" }   # one .dmg for Apple Silicon + Intel
          - { os: ubuntu-22.04,   args: "" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux system libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      # Builds, signs the update payloads, and on a tag push creates the GitHub
      # Release with the installers plus latest.json (what installed apps poll).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && format('Guard++ Desktop {0}', github.ref_name) || '' }}
          includeUpdaterJson: true
      - uses: actions/upload-artifact@v4
        with:
          name: guard-desktop-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/**/release/bundle/**/*.msi
            desktop/src-tauri/target/**/release/bundle/**/*.exe
            desktop/src-tauri/target/**/release/bundle/**/*.dmg
            desktop/src-tauri/target/**/release/bundle/**/*.deb
            desktop/src-tauri/target/**/release/bundle/**/*.AppImage
